plugins {
    id 'java-library'
}

version = "11.2.0"

repositories {
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    compileOnly group: 'com.google.code.gson', name: 'gson', version: '2.13.1'

    // https://mvnrepository.com/artifact/com.google.code.findbugs/jsr305
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'

    // https://mvnrepository.com/artifact/junit/junit
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'

    // gson is compileOnly above, which the test classpath does not inherit
    testImplementation group: 'com.google.code.gson', name: 'gson', version: '2.13.1'
}

jar {
    archiveBaseName.set('plugin-interface')
}
tasks.register('copyJars', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("dependencies")
}


test {
    systemProperty 'noSetup', System.getProperty('noSetup')
}
